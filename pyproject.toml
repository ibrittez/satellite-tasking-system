[project]
name = "sat_task_system"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "-v -m 'not slow'"
pythonpath = ["src", "."]
markers = [
    "slow: long-running benchmark, deselected by default (run with `-m slow`)",
]

[tool.pyright]
extraPaths = ["src"]
